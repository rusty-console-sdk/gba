[project]
site_name = "Rusty Console SDK"
site_description = "Rust SDKs for game consoles."
site_url = "https://rusty-console-sdk.github.io/sdk/"
repo_url = "https://github.com/rusty-console-sdk/sdk"
repo_name = "rusty-console-sdk/sdk"
copyright = "The Rusty Console SDK is free software under the BSD-3-Clause license"

# One section per console, with its pages under docs/<console>/.
nav = [
  { "Overview" = "index.md" },
  { "Consoles" = "consoles.md" },
  { "Game Boy Advance" = [
    { "Overview" = "gba/index.md" },
    { "Getting started" = "gba/getting-started.md" },
    { "Video" = "gba/video.md" },
    { "Input" = "gba/input.md" },
    { "Logging and panics" = "gba/logging.md" },
    { "The runtime" = "gba/runtime.md" },
    { "Backends" = "gba/backends.md" },
    { "Development" = "gba/development.md" },
    { "Roadmap" = "gba/roadmap.md" },
  ] },
]

[project.theme]
language = "en"
features = [
  "content.code.annotate",
  "content.code.copy",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "indigo"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "indigo"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
admonition = {}
attr_list = {}
def_list = {}
md_in_html = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tasklist.custom_checkbox = true
